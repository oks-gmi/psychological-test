<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: #fff8fc;
    }

    .left-menu {
      width: 100%;
      min-height: 100vh;
      padding: 25px 14px;
      overflow-y: auto;
      background: #fff8fc;
    }

    .top-links {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 0 3px 18px;
      padding: 6px;
      background: #eeeeee;
    }

    .top-links a {
      width: 68px;
      padding: 0 2px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #5b5157;
      text-decoration: none;
    }

    .top-links a:hover {
      text-decoration: underline;
    }

    .category-group {
      padding: 10px 8px 12px;
      background: #f3faff;
      border-radius: 8px;
    }

    .category-group + .category-group {
      margin-top: 30px;
    }

    .main-category {
      margin-bottom: 10px;
      padding: 12px 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      background: #4682b4;
      border-radius: 8px;
    }

    .sub-category {
      display: block;
      margin: 5px 7px;
      padding: 9px 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #5b5157;
      text-decoration: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.65);
    }

    .sub-category:hover {
      background: #fff;
      transform: translateX(2px);
    }

    .left-menu {
      scrollbar-width: thin;
      scrollbar-color: #d8d8d8 transparent;
    }

    .left-menu::-webkit-scrollbar {
      width: 7px;
    }

    .left-menu::-webkit-scrollbar-track {
      background: transparent;
    }

    .left-menu::-webkit-scrollbar-thumb {
      background: #d8d8d8;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <nav class="left-menu">

    <div class="top-links">
      <a href="home.html">ホーム</a>
      <a href="info.html">更新情報</a>
    </div>

    <div class="category-group">

      <div class="main-category">心理テスト</div>

      <a href="personality/personality000.html" class="sub-category">性格診断</a>
      <a href="psychopath/psychopath000.html" class="sub-category">サイコパス診断</a>
      <a href="love/love000.html" class="sub-category">恋愛診断</a>
      <a href="r18-love/r18-love000.html" class="sub-category">大人の恋愛診断</a>

    </div>

    <div class="category-group">

      <div class="main-category">クイズ</div>

      <a href="kanji/kanji000.html" class="sub-category">難読漢字</a>
      <a href="food/food000.html" class="sub-category">食べ物</a>
      <a href="animal/animal000.html" class="sub-category">動物</a>
      <a href="mystery/mystery000.html" class="sub-category">なぞとき</a>

    </div>

  </nav>

  <script>
    document.querySelectorAll(".left-menu a").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();

        parent.postMessage({
          type: "changePage",
          url: link.getAttribute("href")
        }, "*");
      });
    });
  </script>

</body>
</html>
