<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
    }

    .left-menu {
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      padding: 25px 14px;

      background: #fff8fc;
      border-right: 3px solid #f0dfe7;
      box-shadow: 5px 0 14px rgba(90, 60, 75, 0.12);
    }

    .main-category {
      margin: 0 0 10px;
      padding: 12px 8px;

      text-align: center;
      font-size: 20px;
      font-weight: 800;

      color: #40383d;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 10px;
    }

    .sub-category {
      display: block;
      margin: 5px 7px;
      padding: 9px 6px;

      text-align: center;
      font-size: 15px;
      font-weight: 700;

      color: #5b5157;
      text-decoration: none;

      border-radius: 8px;
      background: rgba(255, 255, 255, 0.55);

      transition: background 0.2s ease, transform 0.2s ease;
    }

    .sub-category:hover {
      background: #ffffff;
      transform: translateX(2px);
    }

    .category-group + .category-group {
      margin-top: 30px;
    }

    .left-menu::-webkit-scrollbar {
      width: 7px;
    }

    .left-menu::-webkit-scrollbar-thumb {
      background: #d8d8d8;
      border-radius: 10px;
    }

    .left-menu {
      scrollbar-width: thin;
      scrollbar-color: #d8d8d8 transparent;
    }

    @media (max-width: 900px) {
      .left-menu {
        height: auto;
        overflow: visible;
        padding: 14px 10px;

        border-right: none;
        border-bottom: 3px solid #f0dfe7;
        box-shadow: 0 3px 10px rgba(90, 60, 75, 0.10);
      }

      .main-category {
        font-size: 18px;
        padding: 10px 6px;
      }

      .sub-category {
        margin: 4px 5px;
        padding: 8px 4px;
        font-size: 14px;
      }

      .category-group + .category-group {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

<nav class="left-menu">

  <div class="category-group">
    <div class="main-category">心理テスト</div>

    <a href="personality.html" class="sub-category">性格診断</a>
    <a href="love.html" class="sub-category">恋愛診断</a>
    <a href="psychopath.html" class="sub-category">サイコパス診断</a>
  </div>

  <div class="category-group">
    <div class="main-category">クイズ</div>

    <a href="general-knowledge.html" class="sub-category">一般常識</a>
    <a href="kanji-reading.html" class="sub-category">漢字読み問題</a>
    <a href="riddles.html" class="sub-category">なぞなぞ</a>
  </div>

</nav>

<script>
  document.querySelectorAll(".sub-category").forEach(link => {
    link.addEventListener("click", e => {
      e.preventDefault();
      parent.postMessage({
        type: "changePage",
        url: link.href
      }, "*");
    });
  });
</script>

</body>
</html>
