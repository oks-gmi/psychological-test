<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: #4a3f45;
    }

    .left-menu {
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      padding: 25px 14px;

      background: #fff8fc;
      border-right: 4px solid #ead5df;
      box-shadow: 5px 0 16px rgba(90, 60, 75, 0.16);
    }

    .main-category {
      margin-bottom: 10px;
      padding: 12px 8px;

      text-align: center;
      font-size: 20px;
      font-weight: 800;

      color: #40383d;
      background: #fff;
      border-radius: 10px;
    }

    .sub-category {
      display: block;
      margin: 5px 7px;
      padding: 9px 6px;

      text-align: center;
      font-size: 15px;
      font-weight: 700;

      color: #5b5157;
      text-decoration: none;

      border-radius: 8px;
      background: rgba(255, 255, 255, 0.65);

      transition: 0.2s;
    }

    .sub-category:hover {
      background: #fff;
      transform: translateX(2px);
    }

    .category-group + .category-group {
      margin-top: 30px;
    }

    @media (max-width: 900px) {
      .left-menu {
        height: auto;
        overflow: visible;
        padding: 14px 10px;

        border-right: 0;
        border-bottom: 4px solid #ead5df;
        box-shadow: 0 3px 12px rgba(90, 60, 75, 0.12);
      }

      .main-category {
        font-size: 18px;
      }

      .sub-category {
        font-size: 14px;
      }

      .category-group + .category-group {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

<nav class="left-menu">

  <div class="category-group">
    <div class="main-category">心理テスト</div>

    <a href="personality.html" class="sub-category">性格診断</a>
    <a href="love.html" class="sub-category">恋愛診断</a>
    <a href="psychopath.html" class="sub-category">サイコパス診断</a>
  </div>

  <div class="category-group">
    <div class="main-category">クイズ</div>

    <a href="general-knowledge.html" class="sub-category">一般常識</a>
    <a href="kanji-reading.html" class="sub-category">漢字読み問題</a>
    <a href="riddles.html" class="sub-category">なぞなぞ</a>
  </div>

</nav>

<script>
  document.querySelectorAll(".sub-category").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();

      parent.postMessage({
        type: "changePage",
        url: link.getAttribute("href")
      }, "*");
    });
  });
</script>

</body>
</html>
