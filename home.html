<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
    }

    /* 共通ロゴ */
    .logo-frame {
      width: 100%;
      max-width: 600px;
      height: 80px;

      display: block;
      margin: 20px auto 20px;

      border: 0;
      overflow: hidden;
    }

    .category-group {
      width: 100%;
      max-width: 626px;
      margin: 0 auto 35px;
      padding: 18px;

      background: #f3faff;
      border-radius: 14px;
    }

    .main-category {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 18px;
      padding: 14px 20px;

      text-align: center;
      font-size: 26px;
      font-weight: 800;

      color: #ffffff;
      background: #4682b4;

      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .sub-category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-content: center;
      gap: 14px 30px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 78px;
      padding: 14px 18px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 24px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    body.mobile .category-group {
      max-width: 100%;
    }

    body.mobile .main-category {
      width: 100%;
      font-size: 23px;
    }

    body.mobile .sub-category-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    body.mobile .sub-category-card {
      width: 100%;
      min-height: 78px;
      font-size: 24px;
    }

    @media (max-width: 600px) {
      .logo-frame {
        width: 100%;
        height: 65px;
        margin: 20px auto 20px;
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }
    }

    /* フッター */
    .footer-frame {
      width: 100%;
      height: 80px;
      border: 0;
      display: block;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- 共通ロゴ -->
  <iframe
    src="logo.html"
    class="logo-frame"
    title="サイトロゴ">
  </iframe>

  <section class="category-group">

    <div class="main-category">
      心理テスト
    </div>

    <div class="sub-category-grid">

      <a href="personality/personality000.html" class="sub-category-card">
        性格診断
      </a>

      <a href="psychopath/psychopath000.html" class="sub-category-card">
        サイコパス診断
      </a>

      <a href="love/love000.html" class="sub-category-card">
        恋愛診断
      </a>

      <a href="r18-love/r18-love000.html" class="sub-category-card">
        大人の恋愛診断
      </a>

    </div>

  </section>

  <section class="category-group">

    <div class="main-category">
      クイズ
    </div>

    <div class="sub-category-grid">

      <a href="kanji/kanji000.html" class="sub-category-card">
        難読漢字
      </a>

      <a href="food/food000.html" class="sub-category-card">
        食べ物
      </a>

      <a href="animal/animal000.html" class="sub-category-card">
        動物
      </a>

      <a href="mystery/mystery000.html" class="sub-category-card">
        なぞとき
      </a>

    </div>

  </section>

  <!-- 共通フッター -->
  <iframe
    src="footer.html"
    class="footer-frame"
    title="共通フッター">
  </iframe>

  <script>
    window.addEventListener("message", event => {

      if (event.data?.type === "screenMode") {
        document.body.classList.toggle("mobile", event.data.mobile);
        return;
      }

      if (event.data?.type === "changePage") {
        parent.postMessage({
          type: "changePage",
          url: event.data.url
        }, "*");
        return;
      }

      if (event.data?.type === "scrollTop") {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

    });
  </script>

  <script src="main-scroll.js"></script>

</body>
</html>
