<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: #4a3f45;
    }

    .main-category {
      width: fit-content;
      min-width: 230px;
      margin: 0 auto 28px;
      padding: 15px 28px;

      text-align: center;
      font-size: 24px;
      font-weight: 800;

      color: #463b41;
      background: rgba(255, 255, 255, 0.9);

      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
    }

    .sub-category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 65px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 95px;
      padding: 15px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 17px;
      font-weight: 800;
      text-align: center;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 900px) {
      .main-category {
        min-width: 200px;
        font-size: 21px;
        margin-bottom: 20px;
      }

      .sub-category-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 45px;
      }

      .sub-category-card {
        min-height: 80px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <section>
    <div class="main-category">
      心理テスト
    </div>

    <div class="sub-category-grid">

      <a href="personality.html" class="sub-category-card">
        性格診断
      </a>

      <a href="love.html" class="sub-category-card">
        恋愛診断
      </a>

      <a href="psychopath.html" class="sub-category-card">
        サイコパス診断
      </a>

    </div>
  </section>

  <section>
    <div class="main-category">
      クイズ
    </div>

    <div class="sub-category-grid">

      <a href="general-knowledge.html" class="sub-category-card">
        一般常識
      </a>

      <a href="kanji-reading.html" class="sub-category-card">
        漢字読み問題
      </a>

      <a href="riddles.html" class="sub-category-card">
        なぞなぞ
      </a>

    </div>
  </section>

</body>
</html>
