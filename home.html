<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
    }

    .category-group {
      width: 100%;
      max-width: 614px;
      margin: 0 auto 35px;
      padding: 12px;

      background: #f3faff;
      border-radius: 14px;
    }

    .main-category {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 14px;
      padding: 14px 20px;

      text-align: center;
      font-size: 26px;
      font-weight: 800;

      color: #ffffff;
      background: #4682b4;

      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .sub-category-grid {
      display: grid;
      grid-template-columns: 280px 280px;
      justify-content: center;
      gap: 14px 30px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 280px;
      min-height: 78px;
      padding: 14px 18px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 24px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    body.mobile .category-group {
      max-width: 100%;
      padding: 10px;
    }

    body.mobile .main-category {
      width: 100%;
      font-size: 23px;
    }

    body.mobile .sub-category-grid {
      grid-template-columns: 280px;
      gap: 14px;
    }

    body.mobile .sub-category-card {
      width: 280px;
      min-height: 78px;
      font-size: 24px;
    }

    @media (max-width: 320px) {
      body.mobile .sub-category-card {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="category-group">

    <div class="main-category">
      心理テスト
    </div>

    <div class="sub-category-grid">

      <a href="personality.html" class="sub-category-card">
        性格診断
      </a>

      <a href="love.html" class="sub-category-card">
        恋愛診断
      </a>

      <a href="psychopath.html" class="sub-category-card">
        サイコパス診断
      </a>

    </div>

  </section>

  <section class="category-group">

    <div class="main-category">
      クイズ
    </div>

    <div class="sub-category-grid">

      <a href="general-knowledge.html" class="sub-category-card">
        一般常識
      </a>

      <a href="kanji.html" class="sub-category-card">
        難読漢字
      </a>

      <a href="riddles.html" class="sub-category-card">
        なぞなぞ
      </a>

    </div>

  </section>

  <script>
    window.addEventListener("message", event => {
      if (event.data?.type !== "screenMode") return;

      document.body.classList.toggle("mobile", event.data.mobile);
    });
  </script>

</body>
</html>
