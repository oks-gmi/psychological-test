<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      color: #4a3f45;
    }

    .main-category {
      width: fit-content;
      min-width: 210px;
      margin: 0 auto 24px;
      padding: 13px 24px;

      text-align: center;
      font-size: 23px;
      font-weight: 800;

      color: #463b41;
      background: rgba(255, 255, 255, 0.9);

      border-radius: 14px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
    }

    .sub-category-grid {
      display: grid;
      grid-template-columns: repeat(2, 180px);
      justify-content: center;
      gap: 14px 30px;
      margin-bottom: 55px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 180px;
      min-height: 65px;
      padding: 12px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 16px;
      font-weight: 800;
      text-align: center;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .mobile .sub-category-grid {
      grid-template-columns: 180px;
    }
  </style>
</head>

<body>

  <section>
    <div class="main-category">
      心理テスト
    </div>

    <div class="sub-category-grid">

      <a href="personality.html" class="sub-category-card">
        性格診断
      </a>

      <a href="love.html" class="sub-category-card">
        恋愛診断
      </a>

      <a href="psychopath.html" class="sub-category-card">
        サイコパス診断
      </a>

    </div>
  </section>

  <section>
    <div class="main-category">
      クイズ
    </div>

    <div class="sub-category-grid">

      <a href="general-knowledge.html" class="sub-category-card">
        一般常識
      </a>

      <a href="kanji-reading.html" class="sub-category-card">
        漢字読み問題
      </a>

      <a href="riddles.html" class="sub-category-card">
        なぞなぞ
      </a>

    </div>
  </section>

  <script>
    window.addEventListener("message", event => {
      if (event.data?.type !== "screenMode") return;

      document.body.classList.toggle("mobile", event.data.mobile);
    });
  </script>

</body>
</html>
