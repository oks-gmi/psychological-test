<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
    }

    .site-logo {
      display: block;
      width: 100%;
      max-width: 590px;
      margin: 0 auto 35px;

      text-align: center;
      text-decoration: none;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 1px;
      color: #4a3f45;

      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.12);
    }

    .category-group {
      width: 100%;
      max-width: 626px;
      margin: 0 auto 35px;
      padding: 18px;

      background: #f3faff;
      border-radius: 14px;
    }

    .main-category {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 18px;
      padding: 14px 20px;

      text-align: center;
      font-size: 26px;
      font-weight: 800;

      color: #ffffff;
      background: #4682b4;

      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .sub-category-grid {
      display: grid;
      grid-template-columns: 280px 280px;
      justify-content: center;
      gap: 14px 30px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 280px;
      min-height: 78px;
      padding: 14px 18px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 24px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    body.mobile .site-logo {
      font-size: clamp(24px, 7vw, 42px);
      white-space: nowrap;
    }

    body.mobile .category-group {
      max-width: 100%;
    }

    body.mobile .main-category {
      width: 100%;
      font-size: 23px;
    }

    body.mobile .sub-category-grid {
      grid-template-columns: 280px;
      gap: 14px;
    }

    body.mobile .sub-category-card {
      width: 280px;
      min-height: 78px;
      font-size: 24px;
    }

    @media (max-width: 320px) {
      body.mobile .site-logo {
        font-size: 5.5vw;
      }

      body.mobile .sub-category-card {
        width: 100%;
      }
    }

    /* フッター */
    .footer-frame {
      width: 100%;
      height: 80px;
      border: 0;
      display: block;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <a href="home.html" class="site-logo">
    心理テスト＆クイズ｜GMI
  </a>

  <section class="category-group">

    <div class="main-category">
      心理テスト
    </div>

    <div class="sub-category-grid">

      <a href="personality/personality000.html" class="sub-category-card">
        性格診断
      </a>

      <a href="psychopath/psychopath000.html" class="sub-category-card">
        サイコパス診断
      </a>

      <a href="love/love000.html" class="sub-category-card">
        恋愛診断
      </a>

      <a href="r18-love/r18-love000.html" class="sub-category-card">
        大人の恋愛診断
      </a>

    </div>

  </section>

  <section class="category-group">

    <div class="main-category">
      クイズ
    </div>

    <div class="sub-category-grid">

      <a href="kanji/kanji000.html" class="sub-category-card">
        難読漢字
      </a>

      <a href="food/food000.html" class="sub-category-card">
        食べ物
      </a>

      <a href="animal/animal000.html" class="sub-category-card">
        動物
      </a>

      <a href="mystery/mystery000.html" class="sub-category-card">
        謎解き
      </a>

    </div>

  </section>

  <!-- 共通フッター -->
  <iframe
    src="footer.html"
    class="footer-frame"
    title="共通フッター">
  </iframe>

  <script>
    window.addEventListener("message", event => {

      if (event.data?.type === "screenMode") {
        document.body.classList.toggle("mobile", event.data.mobile);
        return;
      }

      if (event.data?.type === "changePage") {
        parent.postMessage({
          type: "changePage",
          url: event.data.url
        }, "*");
        return;
      }

      if (event.data?.type === "scrollTop") {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

    });
  </script>

</body>
</html>
