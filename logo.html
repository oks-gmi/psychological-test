<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    .logo-frame {
      width: 100%;
      max-width: 600px;
      height: 80px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0 10px;
      overflow: hidden;
    }

    .logo-link {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 100%;
      height: 100%;

      text-decoration: none;
    }

    .logo-text {
      max-width: 100%;

      font-size: clamp(20px, 7.5vw, 47px);
      font-weight: 900;

      white-space: nowrap;
      text-align: center;

      color: #000000;
      text-shadow:
        2px 2px 0 #ffffff,
        -2px -2px 0 #ffffff,
        2px -2px 0 #ffffff,
        -2px 2px 0 #ffffff,
        3px 3px 5px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
      .logo-frame {
        height: 65px;
        padding: 6px;
      }

      .logo-text {
        font-size: clamp(28px, 11vw, 47px);
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }

      .logo-text {
        font-size: clamp(24px, 10vw, 42px);
      }
    }
  </style>
</head>

<body>

  <div class="logo-frame">
    <a href="home.html" class="logo-link" onclick="goHome(); return false;">
      <span class="logo-text">心理テスト＆クイズ｜GMI</span>
    </a>
  </div>

  <script>
    function goHome() {
      parent.postMessage({
        type: "changePage",
        url: "home.html"
      }, "*");
    }
  </script>

</body>
</html>
