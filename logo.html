<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
    }

    .logo-frame {
      width: 100%;
      max-width: 570px;
      height: 80px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 10px;

      background: transparent;

      border: 0;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.18);

      overflow: hidden;
    }

    .logo-text {
      margin: 0;

      max-width: 100%;

      color: #000000;

      font-size: 48px;
      font-weight: 900;

      white-space: nowrap;

      text-align: center;

      /*
       * 文字の白い2px縁取り
       */
      -webkit-text-stroke: 2px #ffffff;

      /*
       * 黒い薄い影
       */
      text-shadow:
        2px 2px 3px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 600px) {
      .logo-frame {
        height: 65px;
        padding: 0 6px;
      }

      .logo-text {
        font-size: clamp(
          28px,
          11vw,
          48px
        );
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }

      .logo-text {
        font-size: clamp(
          24px,
          10vw,
          42px
        );
      }
    }
  </style>
</head>

<body>

  <div class="logo-frame">
    <div class="logo-text">
      心理テスト＆クイズ｜GMI
    </div>
  </div>

</body>
</html>
