<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    body {
      font-family: sans-serif;
      background: transparent;
    }

    .site-logo {
      display: block;
      width: 570px;
      max-width: 100%;
      margin: 0 auto;

      text-align: center;
      text-decoration: none;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 1px;

      color: #4a3f45;

      /* 白い2pxの縁取り */
      -webkit-text-stroke: 2px #ffffff;

      /* 外側の黒い細い輪郭 */
      text-shadow:
        1px 0 #000000,
        -1px 0 #000000,
        0 1px #000000,
        0 -1px #000000;

      /* 影 */
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.12));
    }

    @media (max-width: 600px) {
      .site-logo {
        width: 100%;
        font-size: clamp(24px, 7vw, 42px);
        white-space: nowrap;
      }
    }

    @media (max-width: 320px) {
      .site-logo {
        font-size: 5.5vw;
      }
    }
  </style>
</head>

<body>

  <a href="home.html" class="site-logo" id="site-logo">
    心理テスト＆クイズ｜GMI
  </a>

  <script>
    document.getElementById("site-logo").addEventListener("click", event => {
      event.preventDefault();

      parent.postMessage({
        type: "changePage",
        url: "home.html"
      }, "*");
    });
  </script>

</body>
</html>
