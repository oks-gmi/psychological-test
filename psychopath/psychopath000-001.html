<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイコパス診断｜サイコパス診断1</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: transparent;
      color: #333;
    }

    .page-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px 40px;
      box-sizing: border-box;
    }

    .logo-frame {
      width: 100%;
      height: 80px;
      border: none;
      display: block;
      margin: 20px auto 20px;
    }

    .quiz-container {
      max-width: 626px;
      margin: 0 auto;
      background: #fff0eb;
      padding: 25px 25px 30px;
      box-sizing: border-box;
    }

    .page-title {
      margin: 0 0 20px;
      padding: 10px;
      background: #d9785f;
      color: #fff;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .question-box {
      background: #fff;
      padding: 25px 20px;
      text-align: center;
      line-height: 1.8;
      font-size: 18px;
      box-sizing: border-box;
    }

    .answer-button {
      display: block;
      width: 220px;
      margin: 25px auto 0;
      padding: 12px 20px;
      border: none;
      background: #d9785f;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer-button:hover {
      opacity: 0.85;
    }

    .result-box {
      display: none;
      margin-top: 25px;
      background: #fff;
      padding: 25px 20px;
      box-sizing: border-box;
      line-height: 1.8;
    }

    .result-title {
      margin: 0 0 15px;
      font-size: 20px;
      font-weight: bold;
      color: #d9785f;
    }

    .result-section {
      margin-bottom: 25px;
    }

    .result-section:last-child {
      margin-bottom: 0;
    }

    .result-section-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .result-section ol {
      margin: 0;
      padding-left: 25px;
    }

    .result-section li {
      margin-bottom: 8px;
    }

    .note {
      margin-top: 25px;
      padding: 15px;
      background: #fff;
      font-size: 14px;
      line-height: 1.7;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 11px 22px;
      background: #f0a15c;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .back-button:hover {
      opacity: 0.85;
    }

    .footer-frame {
      width: 100%;
      height: 120px;
      border: none;
      display: block;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .page-container {
        padding: 0 10px 30px;
      }

      .logo-frame {
        height: 65px;
        margin: 15px auto 15px;
      }

      .quiz-container {
        padding: 20px 15px 25px;
      }

      .page-title {
        font-size: 22px;
      }

      .question-box {
        font-size: 17px;
        padding: 20px 15px;
      }

      .answer-button {
        font-size: 16px;
      }

      .result-box {
        padding: 20px 15px;
      }

      .result-title {
        font-size: 19px;
      }

      .result-section-title {
        font-size: 16px;
      }

      .note {
        font-size: 13px;
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }

      .page-title {
        font-size: 20px;
      }

      .question-box {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="page-container">

    <iframe
      src="../logo.html"
      class="logo-frame"
      scrolling="no">
    </iframe>

    <div class="quiz-container">

      <h1 class="page-title">【サイコパス診断1】</h1>

      <div class="question-box">
        ある男性は、亡くなった人の写真を見て笑いました。<br>
        しかし、その男性はその人を嫌っていたわけではありません。<br>
        むしろ、とても大切に思っていました。<br><br>
        なぜ男性は笑ったのでしょう？
      </div>

      <button class="answer-button" onclick="showAnswer()">
        結果を見る
      </button>

      <div class="result-box" id="resultBox">

        <h2 class="result-title">一般的な答えの例</h2>

        <div class="result-section">
          <ol>
            <li>楽しかった思い出を思い出したから</li>
            <li>写真の表情が面白かったから</li>
          </ol>
        </div>

        <h2 class="result-title">サイコパス的な答えの例</h2>

        <div class="result-section">
          <ol>
            <li>その人が亡くなったことで、自分にお金が入ってくると思ったから</li>
            <li>自分にとって邪魔なものがいなくなったから</li>
          </ol>
        </div>

        <div class="note">
          ※この診断は医学的・心理学的な診断ではありません。<br>
          あくまで自由な発想を楽しむための心理テストです。
        </div>

      </div>

      <a href="psychopath000.html" class="back-button">
        ← サイコパス診断一覧へ戻る
      </a>

    </div>

    <iframe
      src="../footer.html"
      class="footer-frame"
      scrolling="no">
    </iframe>

  </div>

  <script>
    function showAnswer() {
      const resultBox = document.getElementById("resultBox");
      const button = document.querySelector(".answer-button");

      if (resultBox.style.display === "block") {
        resultBox.style.display = "none";
        button.textContent = "結果を見る";
      } else {
        resultBox.style.display = "block";
        button.textContent = "結果を隠す";
      }
    }
  </script>

</body>
</html>
