<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイコパス診断｜サイコパス診断1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: transparent;
    }

    .logo-frame {
      width: 100%;
      max-width: 600px;
      height: 80px;

      display: block;
      margin: 20px auto 20px;

      border: 0;
      overflow: hidden;
    }

    .quiz-container {
      width: 100%;
      max-width: 626px;
      margin: 0 auto 35px;
      padding: 18px;

      background: #fff0eb;
      border-radius: 14px;
    }

    .page-title {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 25px;
      padding: 14px 20px;

      text-align: center;
      font-size: 26px;
      font-weight: 800;

      color: #ffffff;
      background: #d9785f;

      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .quiz-item {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 25px;
      padding: 20px;

      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);
    }

    .quiz-number {
      margin-bottom: 12px;

      font-size: 20px;
      font-weight: 800;
    }

    .quiz-question {
      margin-bottom: 18px;

      font-size: 22px;
      font-weight: 700;
      line-height: 1.7;
      text-align: center;
    }

    .answer-button {
      display: block;
      margin: 0 auto;

      padding: 10px 24px;

      font-size: 16px;
      font-weight: 700;

      color: #ffffff;
      background: #d9785f;

      border: 0;
      border-radius: 8px;

      cursor: pointer;
    }

    .answer-button:hover {
      opacity: 0.85;
    }

    .answer {
      display: none;

      margin-top: 16px;
      padding: 14px;

      text-align: left;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;

      background: #fff6f2;
      border-top: 1px solid #ead8d2;
    }

    .answer.show {
      display: block;
    }

    .answer-title {
      margin-bottom: 8px;

      font-size: 18px;
      font-weight: 800;
    }

    .answer-list {
      margin: 0 0 20px;
      padding-left: 25px;

      font-size: 17px;
      line-height: 1.8;
    }

    .note {
      margin-top: 10px;
      padding: 16px;

      background: #fffaf8;
      border-top: 1px solid #ead8d2;

      font-size: 14px;
      line-height: 1.8;
      text-align: left;
    }

    .back-button {
      display: block;
      width: fit-content;

      margin: 30px auto 0;
      padding: 10px 24px;

      text-decoration: none;
      font-size: 16px;
      font-weight: 700;

      color: #ffffff;
      background: #d9785f;

      border-radius: 8px;
    }

    .back-button:hover {
      opacity: 0.85;
    }

    .footer-frame {
      width: 100%;
      height: 80px;
      border: 0;
      display: block;
      margin-top: 20px;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .logo-frame {
        width: 100%;
        height: 65px;
        margin: 20px auto 20px;
      }

      .quiz-container {
        margin: 0 15px 30px;
        padding: 15px;
      }

      .page-title {
        width: 100%;
        font-size: 23px;
      }

      .quiz-item {
        width: 100%;
        padding: 18px;
      }

      .quiz-number {
        font-size: 19px;
      }

      .quiz-question {
        font-size: 20px;
      }

      .answer-button {
        font-size: 15px;
      }

      .answer {
        font-size: 17px;
      }

      .answer-title {
        font-size: 17px;
      }

      .answer-list {
        font-size: 16px;
      }

      .note {
        font-size: 13px;
      }

      .back-button {
        font-size: 15px;
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <iframe
    src="../logo.html"
    class="logo-frame"
    title="サイトロゴ"
    scrolling="no">
  </iframe>

  <main class="quiz-container">

    <div class="page-title">
      【サイコパス診断1】
    </div>

    <section class="quiz-item">

      <div class="quiz-number">
        問題
      </div>

      <div class="quiz-question">
        ある男性は、亡くなった人の写真を見て笑いました。<br>
        しかし、その男性はその人を嫌っていたわけではありません。<br>
        むしろ、とても大切に思っていました。<br><br>
        なぜ男性は笑ったのでしょう？
      </div>

      <button class="answer-button" onclick="showAnswer(this)">
        結果を表示
      </button>

      <div class="answer">

        <div class="answer-title">
          一般的な答えの例
        </div>

        <ol class="answer-list">
          <li>楽しかった思い出を思い出したから</li>
          <li>写真の表情が面白かったから</li>
        </ol>

        <div class="answer-title">
          サイコパス的な答えの例
        </div>

        <ol class="answer-list">
          <li>その人が亡くなったことで、自分にお金が入ってくると思ったから</li>
          <li>自分にとって邪魔なものがいなくなったから</li>
        </ol>

        <div class="note">
          ※この診断は医学的・心理学的な診断ではありません。<br>
          あくまで自由な発想を楽しむための心理テストです。
        </div>

      </div>

    </section>

    <a href="psychopath000.html" class="back-button">
      前のページに戻る
    </a>

  </main>

  <iframe
    src="../footer.html"
    class="footer-frame"
    title="共通フッター"
    scrolling="no">
  </iframe>

  <script>
    function showAnswer(button) {
      const answer = button.nextElementSibling;

      answer.classList.add("show");
      button.style.display = "none";
    }

    window.addEventListener("message", event => {

      if (event.data?.type === "changePage") {
        parent.postMessage({
          type: "changePage",
          url: event.data.url
        }, "*");
        return;
      }

      if (event.data?.type === "scrollTop") {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

    });
  </script>

  <script src="../main-scroll.js"></script>

</body>
</html>
