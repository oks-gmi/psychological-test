<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>難読漢字｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: transparent;
    }

    /* 共通ロゴ */
    .logo-frame {
      width: 100%;
      max-width: 600px;
      height: 80px;

      display: block;
      margin: 20px auto 20px;

      border: 0;
      overflow: hidden;
    }

    /* 第二ページ全体 */
    .category-group {
      width: 100%;
      max-width: 626px;
      margin: 0 auto 35px;
      padding: 18px;

      background: #fff0eb;
      border-radius: 14px;
    }

    /* 大カテゴリー */
    .main-category {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 18px;
      padding: 14px 20px;

      text-align: center;
      font-size: 26px;
      font-weight: 800;

      color: #ffffff;
      background: #d9785f;

      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* 大カテゴリー説明 */
    .category-description {
      width: 590px;
      max-width: 100%;
      margin: 0 auto 25px;

      text-align: center;
      font-size: 16px;
      line-height: 1.8;
    }

    /* 中カテゴリー */
    .middle-category {
      width: 100%;
      margin: 0 0 15px;

      font-size: 22px;
      font-weight: 800;
      text-align: left;
    }

    /* 中カテゴリーごとのまとまり */
    .sub-category-group {
      width: 100%;
      margin-bottom: 25px;
    }

    .sub-category-group:last-child {
      margin-bottom: 0;
    }

    /* 小カテゴリー */
    .sub-category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      justify-content: start;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 78px;
      padding: 14px 12px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 24px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;

      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    /* スマホ */
    body.mobile .category-group {
      max-width: 100%;
    }

    body.mobile .main-category {
      width: 100%;
      font-size: 23px;
    }

    body.mobile .category-description {
      width: 100%;
      font-size: 15px;
    }

    body.mobile .middle-category {
      font-size: 21px;
    }

    body.mobile .sub-category-grid {
      grid-template-columns: 1fr;
      gap: 15px;
      justify-items: center;
    }

    body.mobile .sub-category-card {
      width: calc(100% - 30px);
      min-height: 78px;
      font-size: 24px;
    }

    @media (max-width: 600px) {
      .logo-frame {
        width: 100%;
        height: 65px;
        margin: 20px auto 20px;
      }
    }

    @media (max-width: 320px) {
      .logo-frame {
        height: 55px;
      }

      body.mobile .sub-category-card {
        width: calc(100% - 20px);
      }
    }

    /* 共通フッター */
    .footer-frame {
      width: 100%;
      height: 80px;
      border: 0;
      display: block;
      margin-top: 20px;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- 共通ロゴ -->
  <iframe
    src="../logo.html"
    class="logo-frame"
    title="サイトロゴ"
    scrolling="no">
  </iframe>

  <section class="category-group">

    <!-- 大カテゴリー -->
    <div class="main-category">
      難読漢字
    </div>

    <!-- 大カテゴリー説明 -->
    <div class="category-description">
      難しいとされている漢字の読み方を、<br>
      各5問のクイズ形式で出題しています。<br>
      何問解けるか挑戦してみてください。
    </div>

    <!-- 初級 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【初級】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-lv1-001.html" class="sub-category-card">
          初級1
        </a>

      </div>

    </div>

    <!-- 中級 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【中級】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-lv2-001.html" class="sub-category-card">
          中級1
        </a>

      </div>

    </div>

    <!-- 上級 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【上級】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-lv3-001.html" class="sub-category-card">
          上級1
        </a>

      </div>

    </div>

    <!-- 生き物 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【生き物】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-animal-001.html" class="sub-category-card">
          生き物1
        </a>

        <a href="kanji000-animal-002.html" class="sub-category-card">
          生き物2
        </a>

      </div>

    </div>

    <!-- 魚 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【魚】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-fish-001.html" class="sub-category-card">
          魚1
        </a>

        <a href="kanji000-fish-002.html" class="sub-category-card">
          魚2
        </a>

        <a href="kanji000-fish-003.html" class="sub-category-card">
          魚3
        </a>

      </div>

    </div>

    <!-- 植物 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【植物】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-plant-001.html" class="sub-category-card">
          植物1
        </a>

        <a href="kanji000-plant-002.html" class="sub-category-card">
          植物2
        </a>

        <a href="kanji000-plant-003.html" class="sub-category-card">
          植物3
        </a>

      </div>

    </div>

    <!-- 食べ物 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【食べ物】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-food-001.html" class="sub-category-card">
          食べ物1
        </a>

      </div>

    </div>

    <!-- 地名 -->
    <div class="sub-category-group">

      <div class="middle-category">
        【地名】
      </div>

      <div class="sub-category-grid">

        <a href="kanji000-place-001.html" class="sub-category-card">
          地名1
        </a>

      </div>

    </div>

  </section>

  <!-- 共通フッター -->
  <iframe
    src="../footer.html"
    class="footer-frame"
    title="共通フッター"
    scrolling="no">
  </iframe>

  <script>
    window.addEventListener("message", event => {

      if (event.data?.type === "screenMode") {
        document.body.classList.toggle(
          "mobile",
          event.data.mobile
        );
        return;
      }

      if (event.data?.type === "changePage") {
        parent.postMessage({
          type: "changePage",
          url: event.data.url
        }, "*");
        return;
      }

      if (event.data?.type === "scrollTop") {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

    });
  </script>

  <script src="../main-scroll.js"></script>

</body>
</html>
