<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;

      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(255, 177, 204, 0.52),
          transparent 24%
        ),
        radial-gradient(
          circle at 92% 10%,
          rgba(255, 204, 166, 0.46),
          transparent 25%
        ),
        radial-gradient(
          circle at 55% 48%,
          rgba(255, 235, 218, 0.48),
          transparent 32%
        ),
        radial-gradient(
          circle at 12% 88%,
          rgba(255, 199, 218, 0.42),
          transparent 27%
        ),
        radial-gradient(
          circle at 88% 90%,
          rgba(255, 216, 187, 0.38),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #fff0f5 0%,
          #fff5f1 35%,
          #fff9f2 67%,
          #fffdfc 100%
        );

      overflow: hidden;
    }

    /* 背景のドット模様 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(193, 130, 155, 0.19) 1.1px,
          transparent 1.1px
        );

      background-size: 22px 22px;
      opacity: 0.72;
    }

    /* 上部の大きな曲線 */
    body::after {
      content: "";
      position: fixed;

      width: 850px;
      height: 470px;

      top: -230px;
      left: 32%;

      border: 2px solid rgba(227, 143, 171, 0.18);
      border-radius: 50%;

      transform: rotate(-12deg);

      box-shadow:
        0 0 0 30px rgba(255, 187, 208, 0.07),
        0 0 0 65px rgba(255, 207, 176, 0.05);

      pointer-events: none;
      z-index: 0;
    }

    /* 左メニュー */
    .menu-column {
      position: fixed;
      top: 0;
      left: 0;
      width: 210px;
      height: 100vh;
      z-index: 10;

      border-right: 4px solid #d9c0cc;
      box-shadow: 5px 0 14px rgba(80, 55, 70, 0.18);

      overflow: hidden;
    }

    .menu-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 右側全体 */
    .content {
      position: fixed;
      top: 0;
      left: 210px;
      right: 0;
      height: 100vh;

      display: grid;
      grid-template-columns: 260px minmax(620px, 900px) 260px;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #fff4f5,
          #fff9f5 50%,
          #fffdfb
        );
    }

    /* 広告 */
    .ad-space {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(190, 218, 242, 0.50),
          transparent 30%
        ),
        radial-gradient(
          circle at 75% 75%,
          rgba(205, 197, 232, 0.42),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #e6f0f8 0%,
          #e8e8f3 48%,
          #dfedf7 100%
        );

      border-left: 1px solid rgba(125, 155, 185, 0.28);
      border-right: 1px solid rgba(125, 155, 185, 0.28);

      box-shadow:
        inset 0 0 50px rgba(90, 125, 165, 0.11);

      overflow: hidden;
    }

    /* 中央メイン */
    .main {
      position: relative;

      min-height: 100vh;
      padding: 45px 45px 80px;

      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(255, 178, 205, 0.52),
          transparent 27%
        ),
        radial-gradient(
          circle at 92% 13%,
          rgba(255, 207, 168, 0.48),
          transparent 29%
        ),
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 236, 218, 0.42),
          transparent 34%
        ),
        radial-gradient(
          circle at 18% 88%,
          rgba(255, 202, 220, 0.40),
          transparent 29%
        ),
        radial-gradient(
          circle at 88% 86%,
          rgba(255, 215, 188, 0.36),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #fff0f5 0%,
          #fff5f2 34%,
          #fff9f2 68%,
          #fffdfc 100%
        );

      overflow: hidden;
    }

    /* 左側の複数円 */
    .main::before {
      content: "";
      position: absolute;

      width: 500px;
      height: 500px;

      left: -330px;
      top: 8%;

      border: 2px solid rgba(226, 143, 171, 0.18);
      border-radius: 50%;

      box-shadow:
        0 0 0 35px rgba(235, 169, 193, 0.09),
        0 0 0 75px rgba(255, 203, 177, 0.07),
        0 0 0 120px rgba(255, 218, 193, 0.05);

      pointer-events: none;
    }

    /* 右下の重なった曲線 */
    .main::after {
      content: "";
      position: absolute;

      width: 760px;
      height: 340px;

      right: -370px;
      bottom: 5%;

      border: 2px solid rgba(222, 142, 169, 0.19);
      border-radius: 50%;

      transform: rotate(-21deg);

      box-shadow:
        0 28px 0 -10px rgba(229, 159, 181, 0.13),
        0 58px 0 -20px rgba(239, 180, 157, 0.11),
        0 88px 0 -30px rgba(246, 196, 174, 0.08);

      pointer-events: none;
    }

    /* 中央メインのiframe */
    .main-frame-wrapper {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .main-frame {
      width: 100%;
      height: 100%;

      border: 0;
      display: block;
    }

    /* スマホ */
    @media (max-width: 900px) {

      html,
      body {
        height: auto;
        overflow: auto;
      }

      body {
        overflow-y: auto;
      }

      .menu-column {
        display: none;
      }

      .content {
        position: static;
        width: 100%;
        height: auto;

        display: block;
        overflow: visible;
      }

      .ad-space {
        display: none;
      }

      .main {
        width: 100%;
        min-height: auto;
        height: auto;

        padding: 0;

        background:
          radial-gradient(
            circle at 8% 10%,
            rgba(255, 178, 205, 0.52),
            transparent 27%
          ),
          radial-gradient(
            circle at 92% 13%,
            rgba(255, 207, 168, 0.48),
            transparent 29%
          ),
          radial-gradient(
            circle at 50% 45%,
            rgba(255, 236, 218, 0.42),
            transparent 34%
          ),
          radial-gradient(
            circle at 18% 88%,
            rgba(255, 202, 220, 0.40),
            transparent 29%
          ),
          radial-gradient(
            circle at 88% 86%,
            rgba(255, 215, 188, 0.36),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            #fff0f5 0%,
            #fff5f2 34%,
            #fff9f2 68%,
            #fffdfc 100%
          );

        overflow: visible;
      }

      .main-frame-wrapper {
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .main-frame {
        width: 100%;
        min-height: 700px;
        height: auto;
      }
    }
  </style>
  
</head>

<body>

  <!-- 左メニュー -->
  <aside class="menu-column" id="menu-column">

    <iframe
      src="left-menu.html"
      class="menu-frame"
      id="menu-frame"
      title="カテゴリメニュー">
    </iframe>

  </aside>

  <!-- メニュー以外 -->
  <div class="content">

    <!-- 左広告 -->
    <aside class="ad-space" id="left-ad"></aside>

    <!-- 中央メイン -->
    <main class="main" id="main-area">

      <div class="main-frame-wrapper">

        <iframe
          src="home.html"
          class="main-frame"
          id="main-frame"
          title="メインコンテンツ">
        </iframe>

      </div>

    </main>

    <!-- 右広告 -->
    <aside class="ad-space" id="right-ad"></aside>

  </div>

  <script>
    const mainFrame = document.getElementById("main-frame");

    /*
     * ページ切り替え
     */
    window.addEventListener("message", event => {

      if (event.data?.type === "changePage") {

        mainFrame.src = event.data.url;

        document
          .getElementById("left-ad")
          .replaceChildren();

        document
          .getElementById("right-ad")
          .replaceChildren();

        return;
      }

    });

    /*
     * スマホ・PC判定を中央メインへ通知
     */
    function sendScreenMode() {

      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "screenMode",
        mobile: window.innerWidth <= 900
      }, "*");

    }

    /*
     * マウスホイール
     *
     * 左メニュー上
     * → 左メニュー側で独立してスクロール
     *
     * 左メニュー以外
     * → 中央メインをスクロール
     */
    window.addEventListener("wheel", event => {

      if (window.innerWidth <= 900) {
        return;
      }

      const menuColumn =
        document.getElementById("menu-column");

      const menuRect =
        menuColumn.getBoundingClientRect();

      const mouseOnMenu =
        event.clientX >= menuRect.left &&
        event.clientX <= menuRect.right &&
        event.clientY >= menuRect.top &&
        event.clientY <= menuRect.bottom;

      /*
       * 左メニュー上では何もしない
       */
      if (mouseOnMenu) {
        return;
      }

      /*
       * 左メニュー以外は
       * 中央メインへホイールを送る
       */
      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "mainWheel",
        deltaY: event.deltaY
      }, "*");

      event.preventDefault();

    }, {
      passive: false
    });

    /*
     * 中央メイン読み込み完了
     */
    mainFrame.addEventListener("load", () => {

      sendScreenMode();

    });

    /*
     * 画面サイズ変更
     */
    window.addEventListener("resize", () => {

      sendScreenMode();

    });

  </script>

</body>
</html>
