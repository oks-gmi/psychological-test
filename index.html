<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      font-weight: 700;
      color: #4a3f45;

      background:
        radial-gradient(circle at 20% 20%, #ffdff0 0%, transparent 35%),
        radial-gradient(circle at 80% 25%, #dff5ff 0%, transparent 35%),
        radial-gradient(circle at 30% 80%, #eee1ff 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #fff4d9 0%, transparent 35%),
        #fff8fb;
    }

    .page {
      display: grid;
      grid-template-columns: 180px minmax(0, 900px) 180px;
      justify-content: center;
      gap: 24px;
      min-height: 100vh;
    }

    .ad-space {
      background: #dff3fb;
      min-height: 100vh;
    }

    .main-content {
      padding: 60px 30px 80px;
      text-align: center;
    }

    h1 {
      margin: 0 0 50px;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
    }

    .category-title {
      width: fit-content;
      margin: 0 auto 25px;
      padding: 12px 35px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .test-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 55px;
    }

    .test-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #4a3f45;
      text-decoration: none;
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      font-weight: 800;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .test-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 700px) {

      .page {
        display: block;
      }

      .ad-space {
        display: none;
      }

      .main-content {
        padding: 40px 20px 60px;
      }

      h1 {
        margin-bottom: 35px;
        font-size: 2.5rem;
      }

      .category-title {
        margin-bottom: 20px;
        padding: 10px 28px;
        font-size: 1.3rem;
      }

      .test-list {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 45px;
      }

      .test-button {
        min-height: 90px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- 左側：将来の広告スペース -->
    <aside class="ad-space"></aside>

    <main class="main-content">

      <!-- サイトタイトル -->
      <h1>心理テスト</h1>


      <!-- 性格診断 -->
      <div class="category-title">
        性格診断
      </div>

      <div class="test-list">

        <a href="personality-1.html" class="test-button">1</a>
        <a href="personality-2.html" class="test-button">2</a>
        <a href="personality-3.html" class="test-button">3</a>
        <a href="personality-4.html" class="test-button">4</a>
        <a href="personality-5.html" class="test-button">5</a>
        <a href="personality-6.html" class="test-button">6</a>

      </div>


      <!-- 恋愛診断 -->

      </div>

      <div class="test-list">

        <a href="love-1.html" class="test-button">1</a>
