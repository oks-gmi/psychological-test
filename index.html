<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;

      background:
        radial-gradient(
          circle at 8% 12%,
          rgba(255, 166, 193, 0.58) 0,
          rgba(255, 166, 193, 0.25) 12%,
          transparent 25%
        ),
        radial-gradient(
          circle at 25% 28%,
          rgba(255, 205, 132, 0.42) 0,
          rgba(255, 205, 132, 0.18) 13%,
          transparent 28%
        ),
        radial-gradient(
          circle at 48% 8%,
          rgba(255, 191, 151, 0.40) 0,
          rgba(255, 191, 151, 0.16) 14%,
          transparent 29%
        ),
        radial-gradient(
          circle at 72% 18%,
          rgba(255, 221, 145, 0.42) 0,
          rgba(255, 221, 145, 0.17) 13%,
          transparent 27%
        ),
        radial-gradient(
          circle at 91% 10%,
          rgba(255, 173, 204, 0.48) 0,
          rgba(255, 173, 204, 0.18) 14%,
          transparent 28%
        ),
        radial-gradient(
          circle at 14% 58%,
          rgba(255, 193, 154, 0.38) 0,
          rgba(255, 193, 154, 0.15) 15%,
          transparent 30%
        ),
        radial-gradient(
          circle at 40% 52%,
          rgba(255, 222, 164, 0.35) 0,
          rgba(255, 222, 164, 0.13) 14%,
          transparent 29%
        ),
        radial-gradient(
          circle at 66% 62%,
          rgba(255, 177, 201, 0.38) 0,
          rgba(255, 177, 201, 0.14) 15%,
          transparent 30%
        ),
        radial-gradient(
          circle at 88% 48%,
          rgba(255, 203, 145, 0.42) 0,
          rgba(255, 203, 145, 0.15) 14%,
          transparent 29%
        ),
        radial-gradient(
          circle at 20% 92%,
          rgba(255, 174, 197, 0.42) 0,
          rgba(255, 174, 197, 0.16) 14%,
          transparent 29%
        ),
        radial-gradient(
          circle at 50% 88%,
          rgba(255, 211, 153, 0.40) 0,
          rgba(255, 211, 153, 0.15) 15%,
          transparent 30%
        ),
        radial-gradient(
          circle at 82% 91%,
          rgba(255, 188, 164, 0.38) 0,
          rgba(255, 188, 164, 0.14) 14%,
          transparent 29%
        ),
        linear-gradient(
          135deg,
          #fff7f4 0%,
          #fff1f5 28%,
          #fff8ee 55%,
          #fff3f4 78%,
          #fffaf5 100%
        );

      overflow: hidden;
    }

    /* 背景の水玉模様 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(214, 125, 151, 0.18) 1.5px,
          transparent 1.6px
        ),
        radial-gradient(
          circle,
          rgba(230, 157, 92, 0.13) 1.2px,
          transparent 1.3px
        );

      background-size:
        34px 34px,
        52px 52px;

      background-position:
        0 0,
        17px 24px;
    }

    /* 背景の曲線 */
    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: 0;

      border: 3px solid rgba(230, 135, 157, 0.18);
      border-radius: 48% 52% 45% 55%;

      transform: rotate(-9deg) scale(1.08);

      box-shadow:
        0 0 0 38px rgba(255, 190, 160, 0.08),
        0 0 0 82px rgba(255, 212, 146, 0.06);
    }

    /* 左メニュー */
    .menu-column {
      position: fixed;
      top: 0;
      left: 0;
      width: 210px;
      height: 100vh;
      z-index: 10;

      border-right: 4px solid #d9c0cc;
      box-shadow: 5px 0 14px rgba(80, 55, 70, 0.18);

      overflow: hidden;
    }

    .menu-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 右側全体 */
    .content {
      position: fixed;
      top: 0;
      left: 210px;
      right: 0;
      height: 100vh;

      display: grid;

      /*
       * 左右広告は同じ幅で可変。
       * 広告なしの初期幅は200px。
       * 広告表示時は最大300pxまで使用。
       */
      grid-template-columns:
        minmax(200px, 300px)
        minmax(620px, 900px)
        minmax(200px, 300px);

      justify-content: center;

      overflow-x: auto;
      overflow-y: hidden;

      background: transparent;
    }

    /* 広告 */
    .ad-space {
      width: 100%;
      min-width: 200px;
      max-width: 300px;
      min-height: 100vh;

      margin: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(190, 220, 245, 0.34),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(213, 202, 240, 0.30),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #e3edf7 0%,
          #edf0f8 45%,
          #e2eaf5 100%
        );

      border-left: 1px solid rgba(145, 165, 190, 0.28);
      border-right: 1px solid rgba(145, 165, 190, 0.28);

      box-shadow:
        inset 0 0 35px rgba(100, 125, 160, 0.10);

      overflow: hidden;
    }

    /*
     * 広告表示時の余白。
     * 広告幅に対して左右5pxずつ余裕を持たせる。
     */
    .ad-space:has(iframe),
    .ad-space:has(ins) {
      padding-left: 5px;
      padding-right: 5px;
    }

    /* 中央メイン */
    .main {
      position: relative;

      min-height: 100vh;
      padding: 45px 45px 80px;

      background: transparent;

      overflow: hidden;
    }

    /* 中央メインの装飾 */
    .main::before {
      content: "";
      position: absolute;

      width: 420px;
      height: 420px;

      top: 8%;
      left: -210px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 166, 194, 0.25),
          rgba(255, 205, 157, 0.14) 45%,
          transparent 72%
        );

      filter: blur(5px);
      pointer-events: none;
    }

    .main::after {
      content: "";
      position: absolute;

      width: 600px;
      height: 330px;

      right: -250px;
      bottom: 5%;

      border: 3px solid rgba(230, 139, 163, 0.16);
      border-radius: 55% 45% 50% 50%;

      transform: rotate(-18deg);

      box-shadow:
        0 0 0 28px rgba(255, 194, 151, 0.07),
        0 0 70px rgba(255, 177, 198, 0.12);

      pointer-events: none;
    }

    /* 中央メインのiframe */
    .main-frame-wrapper {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .main-frame {
      width: 100%;
      height: 100%;

      border: 0;
      display: block;
    }

    /*
     * 830px未満
     *
     * 左メニューを非表示。
     * 左広告・中央メイン・右広告は維持。
     */
    @media (max-width: 829px) and (min-width: 621px) {

      .menu-column {
        display: none;
      }

      .content {
        left: 0;
        right: 0;

        overflow-x: auto;
        overflow-y: hidden;
      }
    }

    /*
     * 620px以下
     *
     * スマホ版。
     * 左メニュー・左右広告を非表示。
     */
    @media (max-width: 620px) {

      html,
      body {
        height: auto;
        overflow: auto;
      }

      body {
        overflow-y: auto;
      }

      .menu-column {
        display: none;
      }

      .content {
        position: static;
        width: 100%;
        height: auto;

        display: block;
        overflow: visible;

        background: transparent;
      }

      .ad-space {
        display: none;
      }

      .main {
        width: 100%;
        min-height: auto;
        height: auto;

        padding: 0;

        background: transparent;

        overflow: visible;
      }

      .main-frame-wrapper {
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .main-frame {
        width: 100%;
        min-height: 700px;
        height: auto;
      }
    }
  </style>
  
</head>

<body>

  <!-- 左メニュー -->
  <aside class="menu-column" id="menu-column">

    <iframe
      src="left-menu.html"
      class="menu-frame"
      id="menu-frame"
      title="カテゴリメニュー">
    </iframe>

  </aside>

  <!-- メニュー以外 -->
  <div class="content">

    <!-- 左広告 -->
    <aside class="ad-space" id="left-ad"></aside>

    <!-- 中央メイン -->
    <main class="main" id="main-area">

      <div class="main-frame-wrapper">

        <iframe
          src="home.html"
          class="main-frame"
          id="main-frame"
          title="メインコンテンツ">
        </iframe>

      </div>

    </main>

    <!-- 右広告 -->
    <aside class="ad-space" id="right-ad"></aside>

  </div>

  <script>
    const mainFrame = document.getElementById("main-frame");

    /*
     * ページ切り替え
     */
    window.addEventListener("message", event => {

      if (event.data?.type === "changePage") {

        mainFrame.src = event.data.url;

        document
          .getElementById("left-ad")
          .replaceChildren();

        document
          .getElementById("right-ad")
          .replaceChildren();

        return;
      }

    });

    /*
     * スマホ・PC判定を中央メインへ通知
     */
    function sendScreenMode() {

      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "screenMode",
        mobile: window.innerWidth <= 620
      }, "*");

    }

    /*
     * マウスホイール
     *
     * 左メニュー上
     * → 左メニュー側で独立してスクロール
     *
     * 左メニュー以外
     * → 中央メインをスクロール
     */
    window.addEventListener("wheel", event => {

      if (window.innerWidth <= 620) {
        return;
      }

      const menuColumn =
        document.getElementById("menu-column");

      const menuRect =
        menuColumn.getBoundingClientRect();

      const mouseOnMenu =
        event.clientX >= menuRect.left &&
        event.clientX <= menuRect.right &&
        event.clientY >= menuRect.top &&
        event.clientY <= menuRect.bottom;

      /*
       * 左メニュー上では何もしない
       */
      if (mouseOnMenu) {
        return;
      }

      /*
       * 左メニュー以外では
       * 中央メインのiframeを直接スクロール
       */
      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.scrollBy({
        top: event.deltaY,
        left: 0,
        behavior: "auto"
      });

      event.preventDefault();

    }, {
      passive: false
    });

    /*
     * 中央メイン読み込み完了
     */
    mainFrame.addEventListener("load", () => {

      sendScreenMode();

    });

    /*
     * 画面サイズ変更
     */
    window.addEventListener("resize", () => {

      sendScreenMode();

    });

  </script>

</body>
</html>
