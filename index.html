<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: #ffffff;
    }

    .page {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      min-height: 100vh;
    }

    .menu-column {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    .menu-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }

    .content {
      display: grid;
      grid-template-columns: 260px minmax(500px, 900px) 260px;
      justify-content: center;
      min-width: 0;
    }

    .ad-space {
      min-height: 100vh;
      background: #bfefff;
    }

    .main {
      min-height: 100vh;
      padding: 45px 45px 80px;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255, 214, 232, 0.55),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(255, 231, 242, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff0f6 0%,
          #fff6fa 45%,
          #fffdfd 100%
        );
    }

    .main iframe {
      width: 100%;
      min-height: calc(100vh - 125px);
      border: none;
      display: block;
    }

    @media (max-width: 900px) {
      .page {
        display: block;
      }

      .menu-column {
        height: auto;
        position: static;
      }

      .menu-frame {
        height: 320px;
      }

      .content {
        display: block;
      }

      .ad-space {
        display: none;
      }

      .main {
        min-height: auto;
        padding: 30px 15px 60px;
      }

      .main iframe {
        min-height: 700px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <aside class="menu-column">
    <iframe
      src="LeftMenu.html"
      class="menu-frame"
      title="カテゴリメニュー">
    </iframe>
  </aside>

  <div class="content">

    <aside class="ad-space"></aside>

    <main class="main">
      <iframe
        id="main-frame"
        src="home.html"
        title="メインコンテンツ">
      </iframe>
    </main>

    <aside class="ad-space"></aside>

  </div>

</div>

<script>
  window.addEventListener("message", e => {
    if (e.data?.type === "changePage") {
      document.getElementById("main-frame").src = e.data.url;
    }
  });
</script>

</body>
</html>
