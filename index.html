<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: #fff;
      overflow: hidden;
    }

    /* 左メニュー */
    .menu-column {
      position: fixed;
      top: 0;
      left: 0;
      width: 210px;
      height: 100vh;
      z-index: 10;

      border-right: 4px solid #d9c0cc;
      box-shadow: 5px 0 14px rgba(80, 55, 70, 0.18);

      overflow: hidden;
    }

    .menu-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 右側全体 */
    .content {
      position: fixed;
      top: 0;
      left: 210px;
      right: 0;
      height: 100vh;

      display: grid;
      grid-template-columns: 260px minmax(620px, 900px) 260px;
      justify-content: center;

      overflow: hidden;
    }

    /* 広告 */
    .ad-space {
      min-height: 100vh;
      background: #bfefff;
      overflow: hidden;
    }

    /* 中央メイン */
    .main {
      position: relative;

      min-height: 100vh;
      padding: 45px 45px 80px;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255, 214, 232, 0.55),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(255, 231, 242, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff0f6 0%,
          #fff6fa 45%,
          #fffdfd 100%
        );

      overflow: hidden;
    }

    /* 中央メインのiframe */
    .main-frame-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .main-frame {
      width: 100%;
      height: 100%;

      border: 0;
      display: block;
    }

    /* 画面右端のスクロールバー */
    .page-scroll {
      position: fixed;
      top: 0;
      right: 0;

      width: 18px;
      height: 100vh;

      overflow-y: scroll;
      overflow-x: hidden;

      z-index: 20;

      background: transparent;
    }

    .page-scroll-content {
      width: 1px;
      height: 100vh;
    }

    /* スマホ */
    @media (max-width: 900px) {

      html,
      body {
        height: auto;
        overflow: auto;
      }

      body {
        overflow-y: auto;
      }

      .menu-column {
        display: none;
      }

      .content {
        position: static;
        width: 100%;
        height: auto;

        display: block;
        overflow: visible;
      }

      .ad-space {
        display: none;
      }

      .main {
        width: 100%;
        min-height: auto;
        height: auto;

        padding: 0;

        background: none;

        overflow: visible;
      }

      .main-frame-wrapper {
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .main-frame {
        width: 100%;
        min-height: 700px;
        height: auto;
      }

      .page-scroll {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- 左メニュー -->
  <aside class="menu-column" id="menu-column">

    <iframe
      src="left-menu.html"
      class="menu-frame"
      id="menu-frame"
      title="カテゴリメニュー">
    </iframe>

  </aside>

  <!-- メニュー以外 -->
  <div class="content">

    <!-- 左広告 -->
    <aside class="ad-space" id="left-ad"></aside>

    <!-- 中央メイン -->
    <main class="main" id="main-area">

      <div class="main-frame-wrapper">

        <iframe
          src="home.html"
          class="main-frame"
          id="main-frame"
          title="メインコンテンツ">
        </iframe>

      </div>

    </main>

    <!-- 右広告 -->
    <aside class="ad-space" id="right-ad"></aside>

  </div>

  <!-- 画面右端のスクロールバー -->
  <div class="page-scroll" id="page-scroll">
    <div
      class="page-scroll-content"
      id="page-scroll-content">
    </div>
  </div>

  <script>
    const mainFrame = document.getElementById("main-frame");
    const menuColumn = document.getElementById("menu-column");
    const menuFrame = document.getElementById("menu-frame");

    const pageScroll = document.getElementById("page-scroll");
    const pageScrollContent =
      document.getElementById("page-scroll-content");

    let mainPageHeight = window.innerHeight;

    /*
     * main-scroll.js から送られてきた
     * 中央ページ全体の高さを受け取る
     */
    window.addEventListener("message", event => {

      if (event.data?.type === "mainPageHeight") {

        const height = Number(event.data.height);

        if (!Number.isFinite(height)) {
          return;
        }

        mainPageHeight = Math.max(
          height,
          window.innerHeight
        );

        pageScrollContent.style.height =
          mainPageHeight + "px";

        return;
      }

      /*
       * 画面モード
       */
      if (event.data?.type === "screenMode") {

        return;
      }

      /*
       * ページ切り替え
       */
      if (event.data?.type === "changePage") {

        mainFrame.src = event.data.url;

        document
          .getElementById("left-ad")
          .replaceChildren();

        document
          .getElementById("right-ad")
          .replaceChildren();

        pageScroll.scrollTop = 0;

        return;
      }

    });

    /*
     * 右端スクロールバーと
     * 中央ページのスクロール位置を同期
     */
    pageScroll.addEventListener("scroll", () => {

      const pageScrollMax =
        pageScroll.scrollHeight -
        pageScroll.clientHeight;

      const mainScrollMax =
        Math.max(
          0,
          mainPageHeight -
          window.innerHeight
        );

      if (pageScrollMax <= 0) {
        return;
      }

      const ratio =
        pageScroll.scrollTop /
        pageScrollMax;

      const mainScrollTop =
        ratio * mainScrollMax;

      try {

        mainFrame.contentWindow.postMessage({
          type: "mainScroll",
          scrollTop: mainScrollTop
        }, "*");

      } catch (error) {
        // iframe側で処理できない場合
      }

    });

    /*
     * マウスホイール
     *
     * 左メニュー上
     * → 左メニューをスクロール
     *
     * それ以外
     * → 中央メインをスクロール
     */
    window.addEventListener("wheel", event => {

      if (window.innerWidth <= 900) {
        return;
      }

      const menuRect =
        menuColumn.getBoundingClientRect();

      const mouseOnMenu =
        event.clientX >= menuRect.left &&
        event.clientX <= menuRect.right &&
        event.clientY >= menuRect.top &&
        event.clientY <= menuRect.bottom;

      /*
       * 左メニュー上
       */
      if (mouseOnMenu) {

        try {

          menuFrame.contentWindow.scrollBy({
            top: event.deltaY,
            left: 0,
            behavior: "auto"
          });

        } catch (error) {
          // 左メニュー側で処理
        }

        event.preventDefault();

        return;
      }

      /*
       * 左メニュー以外
       * → 中央メイン
       */
      pageScroll.scrollTop += event.deltaY;

      event.preventDefault();

    }, {
      passive: false
    });

    /*
     * 中央ページ読み込み
     */
    mainFrame.addEventListener("load", () => {

      pageScroll.scrollTop = 0;

      sendScreenMode();

    });

    /*
     * ウィンドウサイズ変更
     */
    window.addEventListener("resize", () => {

      sendScreenMode();

    });

    /*
     * 中央ページへ画面モードを通知
     */
    function sendScreenMode() {

      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "screenMode",
        mobile: window.innerWidth <= 900
      }, "*");

    }
  </script>

</body>
</html>
