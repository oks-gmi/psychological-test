<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: #ffffff;
    }

    /* 全体の4列レイアウト */
    .page {
      display: grid;
      grid-template-columns: 190px 260px minmax(500px, 900px) 260px;
      justify-content: center;
      min-height: 100vh;
    }

    /* 左メニュー */
    .menu-column {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
      background: transparent;
    }

    .menu-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* 左右の広告スペース */
    .ad-space {
      min-height: 100vh;
      background: #bfefff;
    }

    /* 中央メインコンテンツ */
    .main {
      min-height: 100vh;
      padding: 45px 45px 80px;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255, 214, 232, 0.55),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(255, 231, 242, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff0f6 0%,
          #fff6fa 45%,
          #fffdfd 100%
        );
    }

    /* 中央の大カテゴリー */
    .main-category {
      width: fit-content;
      min-width: 230px;
      margin: 0 auto 28px;
      padding: 15px 28px;

      text-align: center;
      font-size: 24px;
      font-weight: 800;

      color: #463b41;
      background: rgba(255, 255, 255, 0.9);

      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
    }

    /* 小カテゴリー3列 */
    .sub-category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 65px;
    }

    .sub-category-card {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 95px;
      padding: 15px;

      text-decoration: none;
      color: #4a3f45;

      font-size: 17px;
      font-weight: 800;
      text-align: center;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .sub-category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    /* スマホ */
    @media (max-width: 900px) {
      .page {
        display: block;
      }

      .menu-column {
        height: auto;
        position: static;
      }

      .menu-frame {
        height: 320px;
      }

      .ad-space {
        display: none;
      }

      .main {
        min-height: auto;
        padding: 30px 15px 60px;
      }

      .main-category {
        min-width: 200px;
        font-size: 21px;
        margin-bottom: 20px;
      }

      .sub-category-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 45px;
      }

      .sub-category-card {
        min-height: 80px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- 左：共通メニュー -->
    <aside class="menu-column">
      <iframe
        src="left-menu.html"
        class="menu-frame"
        title="カテゴリメニュー">
      </iframe>
    </aside>

    <!-- 左：広告スペース -->
    <aside class="ad-space"></aside>

    <!-- 中央：メインコンテンツ -->
    <main class="main">

      <!-- 大カテゴリー：心理テスト -->
      <section>
        <div class="main-category">
          心理テスト
        </div>

        <div class="sub-category-grid">

          <a href="personality.html" class="sub-category-card">
            性格診断
          </a>

          <a href="love.html" class="sub-category-card">
            恋愛診断
          </a>

          <a href="psychopath.html" class="sub-category-card">
            サイコパス診断
          </a>

        </div>
      </section>


      <!-- 大カテゴリー：クイズ -->
      <section>
        <div class="main-category">
          クイズ
        </div>

        <div class="sub-category-grid">

          <a href="general-knowledge.html" class="sub-category-card">
            一般常識
          </a>

          <a href="kanji-reading.html" class="sub-category-card">
            漢字読み問題
          </a>

          <a href="riddles.html" class="sub-category-card">
            なぞなぞ
          </a>

        </div>
      </section>

    </main>

    <!-- 右：広告スペース -->
    <aside class="ad-space"></aside>

  </div>

</body>
</html>
