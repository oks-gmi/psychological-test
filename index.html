<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト＆クイズ｜GMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background:
        radial-gradient(
          circle at 10% 15%,
          rgba(255, 190, 208, 0.42),
          transparent 27%
        ),
        radial-gradient(
          circle at 90% 18%,
          rgba(255, 215, 180, 0.38),
          transparent 29%
        ),
        radial-gradient(
          circle at 45% 90%,
          rgba(255, 226, 211, 0.34),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #fff8f6 0%,
          #fff3f6 38%,
          #fff8f1 70%,
          #fffdfb 100%
        );
      overflow: hidden;
    }

    /* 背景のドット模様 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(210, 145, 165, 0.13) 1.2px,
          transparent 1.2px
        );
      background-size: 24px 24px;
      opacity: 0.42;
    }

    /* 背景の光と曲線 */
    body::after {
      content: "";
      position: fixed;
      width: 620px;
      height: 620px;
      top: -230px;
      right: -180px;
      pointer-events: none;
      z-index: 0;

      border: 2px solid rgba(255, 178, 194, 0.12);
      border-radius: 48% 52% 60% 40%;
      transform: rotate(25deg);

      box-shadow:
        0 0 80px rgba(255, 194, 208, 0.16),
        0 0 150px rgba(255, 218, 190, 0.12);
    }

    /* 左メニュー */
    .menu-column {
      position: fixed;
      top: 0;
      left: 0;
      width: 210px;
      height: 100vh;
      z-index: 10;

      border-right: 4px solid #d9c0cc;
      box-shadow: 5px 0 14px rgba(80, 55, 70, 0.18);

      overflow: hidden;
    }

    .menu-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 右側全体 */
    .content {
      position: fixed;
      top: 0;
      left: 210px;
      right: 0;
      height: 100vh;

      display: grid;
      grid-template-columns: 260px minmax(620px, 900px) 260px;
      justify-content: center;

      overflow: hidden;
    }

    /* 広告 */
    .ad-space {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          rgba(225, 235, 246, 0.92),
          rgba(236, 228, 246, 0.88),
          rgba(220, 232, 244, 0.92)
        );

      border-left: 1px solid rgba(150, 165, 190, 0.22);
      border-right: 1px solid rgba(150, 165, 190, 0.22);

      box-shadow:
        inset 0 0 35px rgba(120, 145, 175, 0.08);

      overflow: hidden;
    }

    /* 中央メイン */
    .main {
      position: relative;

      min-height: 100vh;
      padding: 45px 45px 80px;

      background:
        radial-gradient(
          circle at 16% 10%,
          rgba(255, 184, 207, 0.48),
          transparent 33%
        ),
        radial-gradient(
          circle at 84% 17%,
          rgba(255, 211, 176, 0.42),
          transparent 34%
        ),
        radial-gradient(
          circle at 55% 86%,
          rgba(255, 224, 207, 0.35),
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #fff2f5 0%,
          #fff7f5 40%,
          #fff9f1 70%,
          #fffdfc 100%
        );

      overflow: hidden;
    }

    /* 中央メインの背景装飾 */
    .main::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: 8%;
      left: -120px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 198, 215, 0.22),
          transparent 68%
        );

      filter: blur(8px);
      pointer-events: none;
    }

    .main::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 300px;
      right: -220px;
      bottom: 4%;

      border: 2px solid rgba(255, 177, 196, 0.10);
      border-radius: 55% 45% 50% 50%;

      transform: rotate(-18deg);

      box-shadow:
        0 0 65px rgba(255, 193, 207, 0.12);

      pointer-events: none;
    }

    /* 中央メインのiframe */
    .main-frame-wrapper {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .main-frame {
      width: 100%;
      height: 100%;

      border: 0;
      display: block;
    }

    /* スマホ */
    @media (max-width: 900px) {

      html,
      body {
        height: auto;
        overflow: auto;
      }

      body {
        overflow-y: auto;
      }

      .menu-column {
        display: none;
      }

      .content {
        position: static;
        width: 100%;
        height: auto;

        display: block;
        overflow: visible;
      }

      .ad-space {
        display: none;
      }

      .main {
        width: 100%;
        min-height: auto;
        height: auto;

        padding: 0;

        background:
          radial-gradient(
            circle at 16% 10%,
            rgba(255, 184, 207, 0.48),
            transparent 33%
          ),
          radial-gradient(
            circle at 84% 17%,
            rgba(255, 211, 176, 0.42),
            transparent 34%
          ),
          radial-gradient(
            circle at 55% 86%,
            rgba(255, 224, 207, 0.35),
            transparent 38%
          ),
          linear-gradient(
            135deg,
            #fff2f5 0%,
            #fff7f5 40%,
            #fff9f1 70%,
            #fffdfc 100%
          );

        overflow: visible;
      }

      .main-frame-wrapper {
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .main-frame {
        width: 100%;
        min-height: 700px;
        height: auto;
      }
    }
  </style>
  
</head>

<body>

  <!-- 左メニュー -->
  <aside class="menu-column" id="menu-column">

    <iframe
      src="left-menu.html"
      class="menu-frame"
      id="menu-frame"
      title="カテゴリメニュー">
    </iframe>

  </aside>

  <!-- メニュー以外 -->
  <div class="content">

    <!-- 左広告 -->
    <aside class="ad-space" id="left-ad"></aside>

    <!-- 中央メイン -->
    <main class="main" id="main-area">

      <div class="main-frame-wrapper">

        <iframe
          src="home.html"
          class="main-frame"
          id="main-frame"
          title="メインコンテンツ">
        </iframe>

      </div>

    </main>

    <!-- 右広告 -->
    <aside class="ad-space" id="right-ad"></aside>

  </div>

  <script>
    const mainFrame = document.getElementById("main-frame");

    /*
     * ページ切り替え
     */
    window.addEventListener("message", event => {

      if (event.data?.type === "changePage") {

        mainFrame.src = event.data.url;

        document
          .getElementById("left-ad")
          .replaceChildren();

        document
          .getElementById("right-ad")
          .replaceChildren();

        return;
      }

    });

    /*
     * スマホ・PC判定を中央メインへ通知
     */
    function sendScreenMode() {

      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "screenMode",
        mobile: window.innerWidth <= 900
      }, "*");

    }

    /*
     * マウスホイール
     *
     * 左メニュー上
     * → 左メニュー側で独立してスクロール
     *
     * 左メニュー以外
     * → 中央メインをスクロール
     */
    window.addEventListener("wheel", event => {

      if (window.innerWidth <= 900) {
        return;
      }

      const menuColumn =
        document.getElementById("menu-column");

      const menuRect =
        menuColumn.getBoundingClientRect();

      const mouseOnMenu =
        event.clientX >= menuRect.left &&
        event.clientX <= menuRect.right &&
        event.clientY >= menuRect.top &&
        event.clientY <= menuRect.bottom;

      /*
       * 左メニュー上では何もしない
       */
      if (mouseOnMenu) {
        return;
      }

      /*
       * 左メニュー以外は
       * 中央メインへホイールを送る
       */
      if (!mainFrame.contentWindow) {
        return;
      }

      mainFrame.contentWindow.postMessage({
        type: "mainWheel",
        deltaY: event.deltaY
      }, "*");

      event.preventDefault();

    }, {
      passive: false
    });

    /*
     * 中央メイン読み込み完了
     */
    mainFrame.addEventListener("load", () => {

      sendScreenMode();

    });

    /*
     * 画面サイズ変更
     */
    window.addEventListener("resize", () => {

      sendScreenMode();

    });

  </script>

</body>
</html>
