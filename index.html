<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      color: #4a3f45;
      background: #fff;
    }

    /* 左メニュー */
    .menu-column {
      position: fixed;
      left: 0;
      top: 0;
      width: 210px;
      height: 100vh;
      z-index: 10;
    }

    .menu-frame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 右側全体 */
    .content {
      margin-left: 210px;
      display: grid;
      grid-template-columns: 260px minmax(500px, 900px) 260px;
      justify-content: center;
      min-height: 100vh;
    }

    /* 広告 */
    .ad-space {
      min-height: 100vh;
      background: #bfefff;
    }

    /* メイン */
    .main {
      min-height: 100vh;
      padding: 45px 45px 80px;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255, 214, 232, 0.55),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(255, 231, 242, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff0f6 0%,
          #fff6fa 45%,
          #fffdfd 100%
        );
    }

    .main-frame {
      width: 100%;
      min-height: calc(100vh - 125px);
      border: 0;
      display: block;
    }

    @media (max-width: 900px) {
      .menu-column {
        position: static;
        width: 100%;
        height: auto;
      }

      .menu-frame {
        height: 320px;
      }

      .content {
        margin-left: 0;
        display: block;
      }

      .ad-space {
        display: none;
      }

      .main {
        padding: 30px 15px 60px;
      }

      .main-frame {
        min-height: 700px;
      }
    }
  </style>
</head>

<body>

  <!-- 固定メニュー -->
  <aside class="menu-column">
    <iframe
      src="leftmenu.html"
      class="menu-frame"
      title="カテゴリメニュー">
    </iframe>
  </aside>

  <!-- メニュー以外 -->
  <div class="content">

    <aside class="ad-space" id="left-ad"></aside>

    <main class="main">
      <iframe
        src="home.html"
        class="main-frame"
        id="main-frame"
        title="メインコンテンツ">
      </iframe>
    </main>

    <aside class="ad-space" id="right-ad"></aside>

  </div>

  <script>
    window.addEventListener("message", event => {
      if (event.data?.type !== "changePage") return;

      document.getElementById("main-frame").src = event.data.url;

      document.getElementById("left-ad").replaceChildren();
      document.getElementById("right-ad").replaceChildren();

      location.hash = event.data.url;
    });
  </script>

</body>
</html>
