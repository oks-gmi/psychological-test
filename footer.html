<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      color: #5b5157;
      background: transparent;
    }

    .footer {
      width: 100%;
      padding: 20px 10px;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    .footer a {
      color: #5b5157;
      text-decoration: none;
      margin: 0 6px;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .separator {
      color: #b5aeb2;
    }

    @media (max-width: 600px) {
      .footer {
        padding: 18px 5px;
        font-size: 13px;
      }

      .footer a {
        margin: 0 4px;
      }
    }
  </style>
</head>

<body>

  <footer class="footer">

    <a href="home.html" data-page="home.html">ホーム</a>
    <span class="separator">｜</span>

    <a href="info.html" data-page="info.html">更新情報</a>
    <span class="separator">｜</span>

    <a href="privacy.html" data-page="privacy.html">プライバシーポリシー</a>
    <span class="separator">｜</span>

    <a href="terms.html" data-page="terms.html">利用規約</a>
    <span class="separator">｜</span>

    <a href="disclaimer.html" data-page="disclaimer.html">免責事項</a>
    <span class="separator">｜</span>

    <a href="#" id="back-to-top">ページ上部へ</a>

  </footer>

  <script>
    document.querySelectorAll(".footer a[data-page]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();

        parent.postMessage({
          type: "changePage",
          url: link.dataset.page
        }, "*");
      });
    });

    document.getElementById("back-to-top").addEventListener("click", event => {
      event.preventDefault();

      parent.postMessage({
        type: "scrollTop"
      }, "*");
    });
  </script>

</body>
</html>
